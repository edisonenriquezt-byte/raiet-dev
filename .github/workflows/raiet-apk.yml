
name: Crear APK Android RAIET ESABAS

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - pages build and deployment
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - ".github/workflows/raiet-apk.yml"
      - "index.html"
      - "acceso-esabas.js"
      - "mejoras.js"
      - "edicion-financiera.js"
      - "manifest.json"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"

permissions:
  contents: write

jobs:
  compilar-apk:
    name: Compilar APK instalable RAIET ESABAS
    runs-on: ubuntu-24.04

    steps:
      - name: Obtener codigo RAIET
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub Ubuntu 24.04 ya incorpora Android SDK.
      # Evitamos el instalador que solicitaba
      # el paquete obsoleto "tools".

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e

          echo "Verificando Android SDK..."

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: No se encontro sdkmanager."
            exit 1
          fi

          echo "Aceptando licencias Android..."
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          echo "Instalando herramientas necesarias..."
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          echo "Android SDK preparado."

      - name: Preparar proyecto Android RAIET
        shell: bash
        run: |
          set -e

          cat > package.json <<'EOF'
          {
            "name": "raiet-esabas-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "8.0.0",
              "@capacitor/android": "8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "8.0.0"
            }
          }
          EOF

          echo "Instalando Capacitor..."
          npm install --no-audit --no-fund

          echo "Preparando archivos de RAIET..."
          mkdir -p www

          cp index.html www/
          cp acceso-esabas.js www/
          cp mejoras.js www/
          cp edicion-financiera.js www/
          cp manifest.json www/
          cp sw.js www/
          cp icon-192.png www/
          cp icon-512.png www/

          echo "Verificando componentes instalables..."
          grep -q 'RAIET ESABAS' www/index.html
          grep -q 'mejoras.js?v=final-20261115' www/index.html
          grep -q 'edicion-financiera.js?v=final-20261115' www/index.html
          node --check www/mejoras.js
          node --check www/edicion-financiera.js

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.esabas.raietdev",
            "appName": "RAIET ESABAS",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

          echo "Creando proyecto Android..."
          npx cap add android

          echo "Sincronizando archivos..."
          npx cap sync android

          echo "Proyecto Android preparado."

      - name: Compilar APK Android
        working-directory: android
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      - name: Verificar APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se genero la APK."
            exit 1
          fi

          echo "APK generada correctamente:"
          ls -lh "$APK"
          cp "$APK" RAIET-ESABAS.apk
          sha256sum RAIET-ESABAS.apk

      - name: Publicar APK para instalar
        uses: actions/upload-artifact@v4
        with:
          name: RAIET-ESABAS-Android-APK
          path: RAIET-ESABAS.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK de descarga directa
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: raiet-esabas-android-${{ github.run_number }}
        run: |
          set -e
          gh release create "$TAG" RAIET-ESABAS.apk \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "RAIET ESABAS Android · compilación ${{ github.run_number }}" \
            --notes "APK Android instalable de RAIET ESABAS, generada desde la versión web oficial en el repositorio. Incluye clientes, asuntos jurídicos, agenda, cobros, pagos, edición auditada y compresión de fotografías. Compilación debug firmada automáticamente para instalación de prueba; no es una versión firmada para Google Play." \
            --latest
          echo "Enlace permanente: https://github.com/$REPO/releases/latest/download/RAIET-ESABAS.apk"
